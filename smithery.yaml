startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - configPath
    properties:
      configPath:
        type: string
        description: Absolute path to slimmcp upstream MCP servers JSON config (accepts mcpServers or servers)
      policyPath:
        type: string
        description: Optional path to slimmcp.policy.json RBAC and spend-cap policy file
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: [
        'dist/src/cli.js',
        'serve',
        '--config',
        config.configPath,
        ...(config.policyPath ? ['--policy', config.policyPath] : [])
      ]
    })
